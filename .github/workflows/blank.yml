
name: CAO FUJAO V2.3 - GERAR APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Compilar CÃO FUJÃO
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            ZIP=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERRO: ZIP fonte não encontrado"
              exit 1
            fi

            mkdir -p fonte
            unzip -oq "$ZIP" -d fonte
          fi

          PROJECT=$(find "$GITHUB_WORKSPACE" \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: Projeto Android não encontrado"
            exit 1
          fi

          DIR=$(dirname "$PROJECT")

          test -d "$DIR/app"
          test -f "$DIR/app/src/main/AndroidManifest.xml"

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Projeto localizado: $DIR"

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "SDK Manager não encontrado"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true
          set -o pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Compilar aplicativo
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle --version
          gradle --no-daemon clean assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-V2.3-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
