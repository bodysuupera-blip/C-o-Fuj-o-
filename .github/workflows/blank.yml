
name: CAO FUJAO V2.2 - APK CORRIGIDO

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Compilar CÃO FUJÃO
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar e extrair projeto
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            ZIP=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERRO: Nenhum ZIP encontrado."
              exit 1
            fi

            mkdir -p fonte
            unzip -q "$ZIP" -d fonte
          fi

          PROJECT=$(find "$GITHUB_WORKSPACE" \
            -name settings.gradle -o -name settings.gradle.kts \
            | grep -v '/.git/' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          DIR=$(dirname "$PROJECT")

          echo "Projeto encontrado em: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

          test -d "$DIR/app"
          test -f "$DIR/app/src/main/AndroidManifest.xml"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licenças Android
        shell: bash
        run: |
          set +e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | sort | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses
          exit 0

      - name: Instalar Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | sort | tail -n 1)

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Compilar CÃO FUJÃO
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle --version
          gradle --no-daemon clean assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-V2.2
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
