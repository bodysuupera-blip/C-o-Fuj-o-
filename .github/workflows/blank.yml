
name: CAO FUJAO V3.0 - GERAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  gerar-apk:
    name: Compilar Cão Fujão
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licenças Android
        run: yes | sdkmanager --licenses || true

      - name: Instalar componentes Android
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Localizar e extrair projeto
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -name "Cao_Fujao_V3_500_Fases.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: Cao_Fujao_V3_500_Fases.zip não encontrado."
            exit 1
          fi

          mkdir -p projeto
          unzip -o "$ZIP" -d projeto

          if [ ! -f projeto/settings.gradle ] && [ ! -f projeto/settings.gradle.kts ]; then
            echo "ERRO: settings.gradle não encontrado."
            find projeto -maxdepth 3 -type f
            exit 1
          fi

          if [ ! -f projeto/app/build.gradle ] && [ ! -f projeto/app/build.gradle.kts ]; then
            echo "ERRO: app/build.gradle não encontrado."
            find projeto -maxdepth 4 -type f
            exit 1
          fi

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: projeto
        run: gradle assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CAO-FUJAO-V3-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
